# Enable ONLY after the app is tested and certificates for both hostnames exist.
# Requires nginx http context; replace certificate paths only if using another CA layout.
server {
    listen 80;
    server_name ad4growth.com www.ad4growth.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://ad4growth.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.ad4growth.com;
    ssl_certificate /etc/letsencrypt/live/ad4growth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad4growth.com/privkey.pem;
    return 308 https://ad4growth.com$request_uri;
}
server {
    listen 443 ssl;
    server_name ad4growth.com;
    ssl_certificate /etc/letsencrypt/live/ad4growth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad4growth.com/privkey.pem;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
